pre-commit:
  commands:
    lint:
      glob: "*.{ts,js,mjs}"
      stage_fixed: true
      run: pnpm exec oxlint --fix {staged_files}
    format:
      glob: "*.{ts,js,mjs,json,md,yaml,yml}"
      stage_fixed: true
      run: pnpm exec oxfmt {staged_files}
    readme-toc:
      glob: "README.md"
      stage_fixed: true
      run: pnpm exec markdown-toc -i {staged_files} && pnpm exec oxfmt {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
